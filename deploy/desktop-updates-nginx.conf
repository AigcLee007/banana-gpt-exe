# Include inside the HTTPS server {} for m.aittco.com, before the site's proxy fallback.
# Host static storage is outside the Web Docker container.

location = /downloads/version.json {
    alias /www/wwwroot/m.aittco.com/downloads/desktop-updates/current/version.json;
    default_type application/json;
    open_file_cache off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
}

location ~ ^/downloads/updates/(win-x64)/(latest\.yml)$ {
    alias /www/wwwroot/m.aittco.com/downloads/desktop-updates/current/$1/$2;
    default_type application/yaml;
    open_file_cache off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
}

location ~ ^/downloads/updates/(mac-arm64|mac-x64)/(latest-mac\.yml)$ {
    alias /www/wwwroot/m.aittco.com/downloads/desktop-updates/current/$1/$2;
    default_type application/yaml;
    open_file_cache off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
}

# Immutable version filenames keep old in-progress downloads working after a release switch.
# The static module supports byte ranges for differential updater downloads.
location ~ ^/downloads/updates/(win-x64|mac-arm64|mac-x64)/([^/]+\.(?:exe|dmg|zip|blockmap))$ {
    alias /www/wwwroot/m.aittco.com/downloads/desktop-updates/artifacts/$1/$2;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    add_header X-Content-Type-Options nosniff always;
}

# Do not let updater requests fall through to the SPA (HTML is not a native feed).
location /downloads/updates/ { return 404; }

# Block staging, internal receipts, release indexes and the current symlink tree.
location ^~ /downloads/desktop-updates/ { return 404; }
